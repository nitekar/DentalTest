services:
  # FastAPI Backend Service
  - type: web
    name: dental-xray-api
    env: python
    region: oregon
    plan: free
    branch: main
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn api:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.13
      - key: MODEL_PATH
        value: models/dental_model.pth
      - key: PORT
        value: 8000
